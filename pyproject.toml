[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slime-sft-trace"
version = "0.1.0"
description = "Build SFT trajectories from /v1/messages captures of a coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "slime-sft-trace contributors" }]
dependencies = [
    "aiohttp",
    # transformers is only needed in sglang mode (to load the HF tokenizer for
    # chat-template rendering + logprob capture). messages mode does not need
    # it; install with the `sglang` extra when capturing from sglang.
]

[project.optional-dependencies]
sglang = ["transformers"]
torch = ["torch"]
test = ["pytest"]

[project.scripts]
slime-sft-trace = "slime_sft_trace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
